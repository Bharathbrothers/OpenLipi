<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.3" />

  <!-- Script Page Silhouette -->
  <g transform="translate(136, 96)">
    <!-- Back Page (Layered Script Stack) -->
    <rect x="24" y="-8" width="216" height="300" rx="12" fill="#334155" opacity="0.6" transform="rotate(6, 132, 142)" />
    <!-- Front Page (Open Script) -->
    <rect x="0" y="0" width="240" height="320" rx="14" fill="url(#pageGrad)" />
    <!-- Script Brad Fasteners (Left margin 3-hole punch) -->
    <circle cx="28" cy="48" r="6" fill="#94a3b8" />
    <circle cx="28" cy="160" r="6" fill="#94a3b8" />
    <circle cx="28" cy="272" r="6" fill="#94a3b8" />

    <!-- Script Text Lines Simulation -->
    <!-- Scene Heading -->
    <rect x="56" y="44" width="140" height="8" rx="4" fill="#0f172a" />
    <!-- Action paragraph -->
    <rect x="56" y="66" width="160" height="6" rx="3" fill="#64748b" />
    <rect x="56" y="78" width="144" height="6" rx="3" fill="#64748b" />
    <!-- Character Name -->
    <rect x="100" y="102" width="72" height="7" rx="3.5" fill="#0f172a" />
    <!-- Dialogue -->
    <rect x="76" y="117" width="120" height="6" rx="3" fill="#64748b" />
    <rect x="84" y="129" width="104" height="6" rx="3" fill="#64748b" />
  </g>

  <!-- Stylized Fountain Pen Nib & Lipi Quill (Gold Crest) -->
  <g transform="translate(256, 300)" filter="url(#glow)">
    <!-- Nib Body -->
    <path d="M 0,-150 L 54,-40 L 40,70 L -40,70 L -54,-40 Z" fill="url(#goldGrad)" />
    <!-- Nib Shoulder & Wings Highlight -->
    <path d="M 0,-150 L 54,-40 L 44,-36 L 0,-140 L -44,-36 L -54,-40 Z" fill="#fef3c7" opacity="0.8" />
    <!-- Nib Ink Breather Hole -->
    <circle cx="0" cy="-35" r="9" fill="#0f172a" />
    <!-- Nib Center Tine / Slit Line -->
    <line x1="0" y1="-150" x2="0" y2="-26" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />
    <!-- Nib Engraving Arc -->
    <path d="M -26,16 Q 0,-2 26,16" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" />
    <!-- Pen Collar Base -->
    <rect x="-34" y="70" width="68" height="24" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="3" />
  </g>

  <!-- Cinema Clapper Accent Strip at bottom -->
  <g transform="translate(146, 420)">
    <rect x="0" y="0" width="220" height="20" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <path d="M 20,2 L 35,18 M 55,2 L 70,18 M 90,2 L 105,18 M 125,2 L 140,18 M 160,2 L 175,18 M 195,2 L 210,18" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
